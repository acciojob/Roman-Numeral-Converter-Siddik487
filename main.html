<!DOCTYPE html>
<html>
<head>
    <title>Roman Numeral Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            padding: 8px;
            width: 150px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 4px;
        }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Roman Numeral Converter</h2>

        <input type="number" id="numberInput" placeholder="Enter number (0-100000)">
        <br>
        <button onclick="handleConvert()">Convert</button>

        <div id="result"></div>
    </div>

    <script>
        function convertToRoman(num) {

            if (num <= 0) return "";

            const romanMap = [
                ['M', 1000],
                ['CM', 900],
                ['D', 500],
                ['CD', 400],
                ['C', 100],
                ['XC', 90],
                ['L', 50],
                ['XL', 40],
                ['X', 10],
                ['IX', 9],
                ['V', 5],
                ['IV', 4],
                ['I', 1]
            ];

            let result = "";

            for (let i = 0; i < romanMap.length; i++) {
                while (num >= romanMap[i][1]) {
                    result += romanMap[i][0];
                    num -= romanMap[i][1];
                }
            }

            return result;
        }

        function handleConvert() {
            const input = parseInt(document.getElementById("numberInput").value);
            const resultDiv = document.getElementById("result");

            if (isNaN(input) || input < 0 || input > 100000) {
                resultDiv.textContent = "Please enter a number between 0 and 100000.";
                return;
            }

            resultDiv.textContent = convertToRoman(input);
        }
    </script>

</body>
</html>
